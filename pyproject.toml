[project]
name = "payment-processing-service"
version = "0.1.0"
description = "Async payment processing microservice with outbox pattern and RabbitMQ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "faststream[rabbit]>=0.5",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "aio-pika>=9.4",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires docker Postgres/RabbitMQ",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ANN", "B", "C4", "SIM", "RUF",
    "ARG", "PT", "ASYNC", "T20", "BLE",
]
ignore = [
    "ANN401",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Optional".msg = "Use `X | None` instead."
"typing.Union".msg = "Use `X | Y` instead."
"typing.List".msg = "Use `list[X]` instead."
"typing.Dict".msg = "Use `dict[K, V]` instead."
"typing.Tuple".msg = "Use `tuple[X, ...]` instead."
"typing.Set".msg = "Use `set[X]` instead."

[tool.ruff.format]
quote-style = "double"
